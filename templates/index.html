<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Prediction Web App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
  <h1>How long will your order take to come? Find out now!</h1>
  <h2>Just a simple form to track your order!</h2>

  <form action="/predict" method="post">
    <label for="dist">Distance (KM):</label>
    <input type="number" step="any" id="dist" name="dist" required><br><br>

    <label for="traffic">Traffic Level Score:</label>
    <input type="number" step="any" id="traffic" name="traffic" required><br><br>

    <label for="time">Prep Time (Mins):</label>
    <input type="number" step="any" id="time" name="time" required><br><br>

    <button type="submit">Predict Delivery Time</button>
  </form>

  <!-- Flask injects your output_text right here -->
  {% if prediction_text %}
    <h3>{{ prediction_text }}</h3>
  {% endif %}
<p style="color:white;"><small>Disclaimer: For educational purposes only.</small></p>
</body>
</html>
